<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Liked Songs Battle</title>
<style>
  :root{
    --bg:#0b0b0c;--panel:#161618;--panel2:#1f1f22;--line:#2a2a2e;
    --fg:#f4f4f5;--mut:#9b9ba3;--acc:#1db954;--acc2:#1ed760;--bad:#ff6b6b;
    --r:16px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--fg)}
  body{font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;
    background:radial-gradient(900px 400px at 50% -120px,#1db95422,transparent 70%),var(--bg);min-height:100vh}
  #app{max-width:960px;margin:0 auto;padding:32px 20px 64px}
  a{color:var(--acc);text-decoration:none} a:hover{text-decoration:underline}
  .mut{color:var(--mut)} .small{font-size:13px}
  .err{color:var(--bad);margin-top:12px}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:24px}
  .logo{display:flex;align-items:center;gap:12px}
  .logo .dot{width:38px;height:38px;border-radius:50%;background:var(--acc);display:grid;place-items:center;color:#000;font-weight:900;font-size:18px}
  .logo h1{font-size:22px;margin:0;letter-spacing:-.01em}
  .logo .sub{font-size:13px;color:var(--mut);margin-top:-2px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:24px;margin-bottom:16px}
  .panel h2{font-size:17px;margin:0 0 4px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .spacer{flex:1}
  button{font:inherit;font-weight:600;border:1px solid var(--line);border-radius:999px;padding:9px 18px;cursor:pointer;background:var(--panel2);color:var(--fg);transition:background .15s,border-color .15s,transform .05s}
  button:hover{border-color:#44444a;background:#26262a}
  button:active{transform:scale(.98)}
  button.pri{background:var(--acc);border-color:var(--acc);color:#000}
  button.pri:hover{background:var(--acc2);border-color:var(--acc2)}
  button.ghost{background:transparent}
  button:disabled{opacity:.4;cursor:default;transform:none}
  input,textarea{font:inherit;background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none}
  input:focus,textarea:focus{border-color:var(--acc)}
  textarea{width:100%;min-height:130px;resize:vertical;display:block}
  input[type=number]{width:96px}
  code{background:var(--panel2);border:1px solid var(--line);padding:2px 7px;border-radius:6px;word-break:break-all;font-size:13px}
  .seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:4px;gap:2px;margin:16px 0 20px;flex-wrap:wrap}
  .seg button{border:0;background:transparent;color:var(--mut);padding:7px 16px}
  .seg button.act{background:var(--fg);color:#000}
  .steps{margin:0 0 18px;padding:0;list-style:none;counter-reset:s}
  .steps li{counter-increment:s;position:relative;padding:4px 0 4px 36px;margin:4px 0}
  .steps li::before{content:counter(s);position:absolute;left:0;top:4px;width:24px;height:24px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--mut)}
  .drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;width:100%;min-height:150px;border:2px dashed #34343a;border-radius:14px;padding:24px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s}
  .drop:hover,.drop.on{border-color:var(--acc);background:#1db9540d}
  .drop .ic{font-size:28px;line-height:1}
  .files{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
  .files li{display:flex;align-items:center;gap:12px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
  .files .fn{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .files .x{margin-left:auto;padding:3px 10px;font-size:13px}
  .note{background:#1db9540f;border:1px solid #1db95433;border-radius:12px;padding:12px 14px;font-size:13px;color:#cfe9d8}
  details{margin-top:14px} summary{cursor:pointer;color:var(--mut)}
  .opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
  .opt{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:12px 14px;cursor:pointer}
  .opt input{display:none}
  .opt:has(input:checked){border-color:var(--acc);background:#1db95414}
  .opt b{font-size:15px}
  .stat{font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
  .bar{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden}
  .bar>div{height:100%;background:var(--acc);transition:width .25s}
  .stage{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .stage b{font-size:22px;letter-spacing:-.01em}
  .vs{display:grid;grid-template-columns:1fr 56px 1fr;gap:12px;margin-top:20px;align-items:stretch}
  .vsmark{display:grid;place-items:center}
  .vsmark span{width:48px;height:48px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center;font-weight:800;color:var(--mut);font-size:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px;transition:border-color .15s,transform .15s}
  .card:hover{border-color:var(--acc)}
  .cover{width:100%;aspect-ratio:1;border-radius:12px;object-fit:cover;display:grid;place-items:center;cursor:pointer;background:var(--panel2);font-size:64px;font-weight:800;color:#ffffffd9;text-shadow:0 2px 14px #0006;user-select:none}
  .meta{min-height:66px}
  .tname{font-size:18px;font-weight:700;line-height:1.25;overflow-wrap:anywhere}
  .tart{color:var(--mut)} .tal{color:var(--mut);font-size:13px}
  .card iframe{border:0;border-radius:12px;width:100%;display:block;background:var(--panel2)}
  .card .listen{font-size:14px;font-weight:600}
  .card .pick{margin-top:auto;width:100%;padding:12px}
  .center{display:flex;justify-content:center;margin-top:18px}
  .winner{display:grid;grid-template-columns:220px 1fr;gap:24px;align-items:center}
  .winner .cover{cursor:default}
  .winner iframe{border:0;border-radius:12px;width:100%;max-width:460px;height:152px;margin-top:12px}
  .crown{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--acc)}
  .rank{list-style:none;padding:0;margin:0}
  .rank li{display:grid;grid-template-columns:32px 44px 1fr auto;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
  .rank li:last-child{border-bottom:0}
  .rank .num{text-align:right;color:var(--mut);font-variant-numeric:tabular-nums}
  .rank .sq{width:44px;height:44px;border-radius:6px;object-fit:cover;display:grid;place-items:center;font-weight:800;color:#fffd;background:var(--panel2)}
  .rank .t{min-width:0}
  .rank .t div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pill{font-size:12px;color:var(--mut);border:1px solid var(--line);border-radius:999px;padding:2px 10px;white-space:nowrap}
  .pill.g{color:#000;background:var(--acc);border-color:var(--acc);font-weight:700}
  .kbd{display:inline-block;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 6px;font-size:12px;color:var(--fg);background:var(--panel2)}
  .modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:16px;z-index:9}
  .modal .panel{max-width:420px;margin:0}
  .loader{display:flex;flex-direction:column;gap:10px}
  .modal .panel.wide{max-width:520px;width:100%;max-height:calc(100vh - 32px);overflow:auto}
  .shareimg{width:100%;border-radius:12px;display:block;border:1px solid var(--line);background:var(--panel2);aspect-ratio:4/5;object-fit:contain}
  .big{padding:14px 26px;font-size:16px}
  .spot{display:inline-flex;align-items:center;gap:10px}
  .spot svg{width:22px;height:22px}
  @media (max-width:720px){
    #app{padding:20px 14px 48px}
    .vs{grid-template-columns:1fr}.vsmark{height:24px}.vsmark span{width:40px;height:40px}
    .opts{grid-template-columns:1fr}
    .winner{grid-template-columns:1fr}.winner .cover{max-width:240px}
    .cover{font-size:48px}
  }
</style>
</head>
<body>
<div id="app"></div>
<script>
const MODE = '__MODE__'; // 'local' — сайт (обложки и отрывки через плеер Spotify); 'artifact' — Claude-артефакт без внешних ресурсов
const FULL = MODE === 'local';
const app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch {} }
};
function randStr(n) { const c = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789'; return Array.from(crypto.getRandomValues(new Uint8Array(n)), x => c[x % c.length]).join(''); }
async function challenge(v) { const d = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(v)); return btoa(String.fromCharCode(...new Uint8Array(d))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function hash(s) { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) | 0; return Math.abs(h); }
function grad(t) { const h = hash(t.a + '|' + t.al), h1 = h % 360, h2 = (h1 + 40 + (h >> 9) % 80) % 360; return `background:linear-gradient(135deg,hsl(${h1} 55% 40%),hsl(${h2} 60% 20%))`; }
function initials(t) { return (t.n || '?').replace(/[^\p{L}\p{N}]+/gu, ' ').trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase() || '♪'; }
function sidOf(uri) { const m = String(uri || '').match(/(?:spotify:track:|open\.spotify\.com\/(?:intl-\w+\/)?track\/)([A-Za-z0-9]{22})/); return m ? m[1] : ''; }
function spUrl(t) { return t.sid ? 'https://open.spotify.com/track/' + t.sid : 'https://open.spotify.com/search/' + encodeURIComponent((t.a ? t.a + ' ' : '') + t.n); }
const embed = (sid, h) => `<iframe src="https://open.spotify.com/embed/track/${esc(sid)}?utm_source=generator&theme=0" style="height:${h}px" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>`;

let tracks = LS.get('tracks', null);
let T = LS.get('tournament', null);
let view = 'menu', showAll = false, srcTab = 'files', msg = '';
let pending = [];


/* ---------- Import from files / text ---------- */
function parseCSV(text) {
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(f); f = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
    else f += c;
  }
  if (f || row.length) { row.push(f); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim()));
}
function fromCSV(text) {
  const rows = parseCSV(text.replace(/^﻿/, ''));
  if (rows.length < 2) throw new Error('в файле нет строк с треками');
  const h = rows[0].map(x => x.trim().toLowerCase());
  const col = (...names) => { for (const n of names) { let i = h.indexOf(n); if (i < 0) i = h.findIndex(x => x.includes(n) && !(n === 'name' && /album|artist|playlist|label/.test(x))); if (i >= 0) return i; } return -1; };
  const iN = col('track name', 'name', 'title', 'название'), iA = col('artist name', 'artist', 'исполнитель'),
        iAl = col('album name', 'album', 'альбом'), iU = col('track uri', 'uri', 'spotify id', 'url'),
        iD = col('added at', 'date added'), iI = col('album image url', 'image');
  if (iN < 0) throw new Error('не нашёл колонку с названием трека (Track Name)');
  return rows.slice(1).map(r => ({ n: r[iN], a: iA >= 0 ? (r[iA] || '').replace(/\\,/g, ',') : '', al: iAl >= 0 ? r[iAl] : '',
    uri: iU >= 0 ? r[iU] : '', added: iD >= 0 ? r[iD] : '', img: iI >= 0 ? r[iI] : '' })).filter(t => t.n);
}
function fromJSON(text) {
  const j = JSON.parse(text);
  const arr = Array.isArray(j) ? j : (j.tracks || j.items || []);
  return arr.map(x => {
    const t = x.track && typeof x.track === 'object' ? x.track : x;
    return { n: t.track || t.name || t.trackName || '', a: t.artist || t.artistName || (t.artists ? t.artists.map(a => a.name || a).join(', ') : ''),
      al: typeof t.album === 'string' ? t.album : (t.album && t.album.name) || '', uri: t.uri || '', added: x.added_at || '' };
  }).filter(t => t.n);
}
function fromText(text) {
  return text.split(/\r?\n/).map(l => l.trim()).filter(Boolean).map(l => {
    const sid = sidOf(l);
    if (sid) return { n: 'Трек ' + sid.slice(0, 6), a: '', uri: 'spotify:track:' + sid };
    const m = l.match(/^(.+?)\s+[—–-]\s+(.+)$/);
    return m ? { a: m[1].trim(), n: m[2].trim() } : { a: '', n: l };
  });
}
function setTracks(list, sortByAdded) {
  const seen = new Set(), out = [];
  for (const t of list) {
    const sid = sidOf(t.uri);
    const key = sid || ((t.a || '') + '|' + t.n).toLowerCase();
    if (seen.has(key)) continue; seen.add(key);
    out.push({ n: String(t.n).trim(), a: (t.a || '').trim(), al: (t.al || '').trim(), sid,
      img: FULL ? (t.img || '') : '', thumb: FULL ? (t.thumb || t.img || '') : '', added: t.added || '' });
  }
  if (out.length < 2) throw new Error('нужно хотя бы 2 трека, нашёл ' + out.length);
  if (sortByAdded && out.some(t => t.added)) out.sort((x, y) => (y.added || '').localeCompare(x.added || ''));
  out.forEach((t, i) => t.id = 'x' + i);
  tracks = out; LS.set('tracks', tracks); LS.set('tracksAt', Date.now());
}
async function addFiles(files) {
  msg = '';
  for (const f of files) {
    try {
      const text = await f.text();
      const list = (/\.json$/i.test(f.name) || /^\s*[\[{]/.test(text)) ? fromJSON(text) : fromCSV(text);
      if (!list.length) throw new Error('треков не найдено');
      pending = pending.filter(p => p.name !== f.name).concat({ name: f.name, list });
    } catch (e) { msg = `«${f.name}»: ${e.message}`; }
  }
  render();
}
function removeFile(i) { pending.splice(i, 1); render(); }
function pendingCount() { const s = new Set(); pending.forEach(p => p.list.forEach(t => s.add(sidOf(t.uri) || ((t.a || '') + '|' + t.n).toLowerCase()))); return s.size; }
function usePending() { try { setTracks(pending.flatMap(p => p.list), true); pending = []; msg = ''; view = 'menu'; render(); } catch (e) { msg = e.message; render(); } }
function importPasted() { try { setTracks(fromText(document.getElementById('paste').value), false); msg = ''; view = 'menu'; render(); } catch (e) { msg = e.message; render(); } }
function demo() { const d = []; for (let i = 1; i <= 16; i++) d.push({ a: 'Демо-артист ' + ((i % 5) + 1), n: 'Песня №' + i, al: 'Демо-альбом' }); setTracks(d, false); view = 'menu'; render(); }
function forget() { ask('Удалить загруженный список и турнир?', () => { LS.del('tracks'); LS.del('tournament'); LS.del('tok'); LS.del('cid'); tracks = null; T = null; view = 'import'; render(); }); }

/* ---------- Tournament ---------- */
__CORE__
/* ---------- UI helpers ---------- */
function shell(inner, right = '') {
  return `<header><div class="logo"><div class="dot">♥</div><div><h1>Liked Songs Battle</h1><div class="sub">Выбери любимый трек из своих лайков</div></div></div><div class="row">${right}</div></header>${inner}`;
}
function ask(text, yes) {
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="panel"><div style="margin-bottom:16px">${esc(text)}</div><div class="row"><button class="pri" id="mY">Да</button><button id="mN">Отмена</button></div></div>`;
  document.body.appendChild(m);
  m.querySelector('#mY').onclick = () => { m.remove(); yes(); };
  m.querySelector('#mN').onclick = () => m.remove();
  m.onclick = e => { if (e.target === m) m.remove(); };
}
function copy(text, btn) {
  try { navigator.clipboard.writeText(text).then(() => btn.textContent = 'Скопировано ✓', () => btn.textContent = 'Не вышло скопировать'); }
  catch { btn.textContent = 'Не вышло скопировать'; }
}
function art(t, cls, big) {
  const src = big ? (t.img || t.thumb) : (t.thumb || t.img);
  if (FULL && src) return `<img class="${cls}" src="${esc(src)}" alt="" ${cls === 'cover' ? 'onclick="this.dataset.side&&pick(+this.dataset.side)"' : ''}>`;
  return `<div class="${cls}" style="${grad(t)}">${esc(cls === 'sq' ? initials(t)[0] : initials(t))}</div>`;
}


/* ---------- Share image ---------- */
let DL = null;
if (!FULL && window.claude && typeof window.claude.use === 'function') window.claude.use('downloads').then(d => { DL = d; }).catch(() => {});
const FONT = 'system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif';
function loadImg(src) {
  return new Promise(res => {
    if (!src) return res(null);
    const im = new Image(); let done = false;
    const end = v => { if (!done) { done = true; res(v); } };
    im.crossOrigin = 'anonymous';
    im.onload = () => end(im); im.onerror = () => end(null);
    setTimeout(() => end(null), 5000);
    im.src = src;
  });
}
async function coverFor(t) {
  if (!FULL) return null;
  let src = t.img || t.thumb;
  if (!src && t.sid) {
    try {
      const r = await fetch('https://open.spotify.com/oembed?url=' + encodeURIComponent('https://open.spotify.com/track/' + t.sid));
      if (r.ok) src = (await r.json()).thumbnail_url;
    } catch {}
  }
  return loadImg(src);
}
function rrect(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function fit(ctx, text, maxW) {
  text = String(text || '');
  if (ctx.measureText(text).width <= maxW) return text;
  let s = text; while (s.length > 1 && ctx.measureText(s + '…').width > maxW) s = s.slice(0, -1);
  return s.trimEnd() + '…';
}
function wrap2(ctx, text, maxW) {
  if (ctx.measureText(text).width <= maxW) return [text];
  const words = text.split(/\s+/); let line = '';
  for (let i = 0; i < words.length; i++) {
    const test = line ? line + ' ' + words[i] : words[i];
    if (ctx.measureText(test).width > maxW && line) return [line, fit(ctx, words.slice(i).join(' '), maxW)];
    line = test;
  }
  return [fit(ctx, line, maxW)];
}
function drawArt(ctx, img, t, x, y, s, r) {
  ctx.save(); rrect(ctx, x, y, s, s, r); ctx.clip();
  if (img) ctx.drawImage(img, x, y, s, s);
  else {
    const h = hash(t.a + '|' + t.al), h1 = h % 360, h2 = (h1 + 40 + (h >> 9) % 80) % 360;
    const g = ctx.createLinearGradient(x, y, x + s, y + s);
    g.addColorStop(0, `hsl(${h1},55%,40%)`); g.addColorStop(1, `hsl(${h2},60%,20%)`);
    ctx.fillStyle = g; ctx.fillRect(x, y, s, s);
    ctx.fillStyle = 'rgba(255,255,255,.88)'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = `800 ${Math.round(s * .3)}px ${FONT}`; ctx.fillText(initials(t), x + s / 2, y + s / 2 + s * .02);
    ctx.textBaseline = 'alphabetic';
  }
  ctx.restore();
}
async function makeShareImage() {
  const W = 1080, H = 1350, c = document.createElement('canvas'); c.width = W; c.height = H;
  const ctx = c.getContext('2d');
  const r = ranking(), w = tr(T.winner), rest = r.slice(1, 5).map(x => ({ t: tr(x.id), label: x.label }));
  const [wImg, ...rImgs] = await Promise.all([coverFor(w), ...rest.map(x => coverFor(x.t))]);
  ctx.fillStyle = '#0b0b0c'; ctx.fillRect(0, 0, W, H);
  const gl = ctx.createRadialGradient(W / 2, 60, 40, W / 2, 60, 820);
  gl.addColorStop(0, 'rgba(29,185,84,.32)'); gl.addColorStop(1, 'rgba(29,185,84,0)');
  ctx.fillStyle = gl; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#1db954'; ctx.font = `800 24px ${FONT}`;
  ctx.fillText('L I K E D   S O N G S   B A T T L E', W / 2, 80);
  ctx.fillStyle = '#f4f4f5'; ctx.font = `800 52px ${FONT}`;
  ctx.fillText('🏆 Мой любимый трек', W / 2, 146);
  const S = 480, cx = (W - S) / 2, cy = 190;
  ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = 50; ctx.shadowOffsetY = 18; ctx.fillStyle = '#000'; rrect(ctx, cx, cy, S, S, 28); ctx.fill(); ctx.restore();
  drawArt(ctx, wImg, w, cx, cy, S, 28);
  ctx.textAlign = 'center'; ctx.fillStyle = '#f4f4f5'; ctx.font = `800 56px ${FONT}`;
  const lines = wrap2(ctx, w.n, W - 140); let y = cy + S + 82;
  lines.forEach(l => { ctx.fillText(l, W / 2, y); y += 64; });
  ctx.fillStyle = '#b5b5bd'; ctx.font = `500 34px ${FONT}`; ctx.fillText(fit(ctx, w.a, W - 160), W / 2, y);
  ctx.fillStyle = '#7c7c85'; ctx.font = `500 25px ${FONT}`; ctx.fillText(`победил среди ${T.n} треков · ${T.total} выборов`, W / 2, y + 44);
  const ly = y + 84;
  if (rest.length) {
    const boxH = H - ly - 64;
    ctx.fillStyle = 'rgba(255,255,255,.045)'; rrect(ctx, 70, ly, W - 140, boxH, 24); ctx.fill();
    const rowH = Math.min(80, (boxH - 24) / rest.length), s = Math.max(30, Math.min(54, rowH - 16));
    rest.forEach((x, i) => {
      const ry = ly + 12 + i * rowH + (rowH - s) / 2, mid = ry + s / 2;
      ctx.textAlign = 'left'; ctx.fillStyle = '#7c7c85'; ctx.font = `700 26px ${FONT}`; ctx.fillText(String(i + 2), 102, mid + 9);
      drawArt(ctx, rImgs[i], x.t, 142, ry, s, 8);
      ctx.textAlign = 'left'; ctx.fillStyle = '#f4f4f5'; ctx.font = `700 26px ${FONT}`; ctx.fillText(fit(ctx, x.t.n, 560), 142 + s + 20, mid - 3);
      ctx.fillStyle = '#9b9ba3'; ctx.font = `500 21px ${FONT}`; ctx.fillText(fit(ctx, x.t.a, 560), 142 + s + 20, mid + 24);
      ctx.textAlign = 'right'; ctx.fillStyle = '#9b9ba3'; ctx.font = `600 21px ${FONT}`; ctx.fillText(x.label, W - 102, mid + 8);
    });
  }
  ctx.textAlign = 'center'; ctx.fillStyle = '#55555c'; ctx.font = `500 21px ${FONT}`;
  ctx.fillText(new Date().toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' }), W / 2, H - 26);
  return new Promise(res => c.toBlob(res, 'image/png'));
}
let shareBlob = null, shareURL = null;
async function openShare() {
  closeShare();
  const m = document.createElement('div'); m.className = 'modal'; m.id = 'shareModal';
  m.innerHTML = `<div class="panel wide"><div class="row" style="margin-bottom:12px"><h2>Картинка с результатом</h2><span class="spacer"></span><button class="ghost" onclick="closeShare()">✕</button></div><div class="shareimg" style="display:grid;place-items:center" id="shBox"><span class="mut">Рисую…</span></div><div class="row" id="shBtns" style="margin-top:14px"></div><div class="mut small" id="shMsg" style="margin-top:10px"></div></div>`;
  m.onclick = e => { if (e.target === m) closeShare(); };
  document.body.appendChild(m);
  try { shareBlob = await makeShareImage(); } catch (e) { console.error(e); shareBlob = null; }
  if (!document.getElementById('shareModal')) return;
  if (!shareBlob) { document.getElementById('shBox').innerHTML = '<span class="err">Не получилось нарисовать картинку</span>'; return; }
  if (shareURL) URL.revokeObjectURL(shareURL);
  shareURL = URL.createObjectURL(shareBlob);
  document.getElementById('shBox').outerHTML = `<img class="shareimg" src="${shareURL}" alt="Результат">`;
  const file = new File([shareBlob], 'my-favorite-song.png', { type: 'image/png' });
  const btns = [];
  let canNative = false; try { canNative = FULL && !!navigator.canShare && navigator.canShare({ files: [file] }); } catch {}
  if (canNative) btns.push(`<button class="pri" onclick="shareNative()">Поделиться</button>`);
  if (FULL || DL) btns.push(`<button class="${btns.length ? '' : 'pri'}" onclick="saveShare()">Сохранить PNG</button>`);
  if (window.ClipboardItem && navigator.clipboard && navigator.clipboard.write) btns.push(`<button onclick="copyShare(this)">Копировать картинку</button>`);
  document.getElementById('shBtns').innerHTML = btns.join('');
  shMsg(btns.length ? '' : 'Сохрани картинку: правый клик или долгое нажатие → «Сохранить изображение».');
}
function closeShare() { const m = document.getElementById('shareModal'); if (m) m.remove(); }
function shMsg(s) { const e = document.getElementById('shMsg'); if (e) e.textContent = s; }
async function shareNative() {
  const w = tr(T.winner);
  try { await navigator.share({ files: [new File([shareBlob], 'my-favorite-song.png', { type: 'image/png' })], title: 'Мой любимый трек', text: `Мой любимый трек из лайков: ${w.a ? w.a + ' — ' : ''}${w.n}` }); }
  catch (e) { if (e.name !== 'AbortError') shMsg('Не получилось открыть меню «Поделиться» — сохрани PNG.'); }
}
async function saveShare() {
  if (FULL) { const a = document.createElement('a'); a.href = shareURL; a.download = 'my-favorite-song.png'; document.body.appendChild(a); a.click(); a.remove(); shMsg('Сохранено ✓'); return; }
  try { await DL.save({ filename: 'my-favorite-song.png', data: shareBlob }); shMsg('Сохранено ✓'); }
  catch (e) { shMsg(e && e.code === 'declined' ? 'Сохранение отменено.' : 'Здесь сохранить не вышло — правый клик или долгое нажатие на картинке → «Сохранить изображение».'); }
}
async function copyShare(btn) {
  try { await navigator.clipboard.write([new ClipboardItem({ 'image/png': shareBlob })]); btn.textContent = 'Скопировано ✓'; shMsg('Теперь вставь в любой чат (Ctrl+V).'); }
  catch { btn.textContent = 'Не вышло'; shMsg('Копирование картинок здесь заблокировано — сохрани PNG.'); }
}
/* ---------- Views ---------- */
function viewImport() {
  const tabs = [['files', 'Exportify / CSV'], ['text', 'Вставить списком']];
  const seg = `<div class="seg">${tabs.map(([k, l]) => `<button class="${srcTab === k ? 'act' : ''}" onclick="srcTab='${k}';msg='';render()">${l}</button>`).join('')}</div>`;
  let body = '';
  if (srcTab === 'files') {
    body = `
      <ol class="steps">
        <li>Открой <a href="https://exportify.app" target="_blank" rel="noopener">exportify.app</a> и войди через Spotify.</li>
        <li>Нажми <b>Export</b> у <b>Liked Songs</b> (и у любых других плейлистов, если хочешь их добавить).</li>
        <li>Перетащи сюда один или сразу несколько CSV. Подойдёт и <code>YourLibrary.json</code> из экспорта данных Spotify.</li>
      </ol>
      <label class="drop" id="drop">
        <input type="file" accept=".csv,.json,text/csv,application/json" multiple hidden id="fi">
        <div class="ic">⤓</div><b>Перетащи файлы сюда</b><div class="mut small">или нажми, чтобы выбрать — можно несколько .csv / .json</div>
      </label>
      ${pending.length ? `<ul class="files">${pending.map((p, i) => `<li><span>📄</span><span class="fn">${esc(p.name)}</span><span class="mut small">${p.list.length} тр.</span><button class="x ghost" onclick="removeFile(${i})">✕</button></li>`).join('')}</ul>
        <div class="row" style="margin-top:16px"><span class="mut">Всего уникальных: <b style="color:var(--fg)">${pendingCount()}</b></span><span class="spacer"></span><button class="pri" onclick="usePending()">Готово →</button></div>` : ''}
      ${msg ? `<div class="err">${esc(msg)}</div>` : ''}`;
  } else {
    body = `
      <div class="mut" style="margin-bottom:10px">Каждая строка — один трек: <b style="color:var(--fg)">Исполнитель — Название</b>${FULL ? ' или ссылка на трек в Spotify' : ''}.</div>
      <textarea id="paste" placeholder="Кино — Группа крови&#10;Radiohead — Creep"></textarea>
      <div class="row" style="margin-top:14px"><span class="spacer"></span><button class="pri" onclick="importPasted()">Загрузить список</button></div>
      ${msg ? `<div class="err">${esc(msg)}</div>` : ''}`;
  }
  const limit = FULL ? '' : `<div class="note" style="margin-top:20px">Здесь нет обложек и отрывков: страница работает в изолированной среде, где Spotify заблокирован. На сайте <b>firetruck92.github.io/liked-songs-battle</b> они есть.</div>`;
  app.innerHTML = shell(`
    <div class="panel"><h2>Загрузи свои лайки</h2><div class="mut small">Выбери способ — потом начнётся турнир: из каждой пары оставляешь один трек, пока не останется победитель.</div>
      ${seg}${body}${limit}
    </div>
    <div class="mut small">Файлы читаются прямо в браузере и никуда не отправляются · <a href="#" onclick="demo();return false">попробовать на демо-списке</a></div>`,
    tracks ? `<button onclick="view='menu';msg='';render()">← Назад</button>` : '');
  const fi = document.getElementById('fi'), dr = document.getElementById('drop');
  if (fi) {
    fi.onchange = () => { addFiles([...fi.files]); fi.value = ''; };
    dr.ondragover = e => { e.preventDefault(); dr.classList.add('on'); };
    dr.ondragleave = () => dr.classList.remove('on');
    dr.ondrop = e => { e.preventDefault(); dr.classList.remove('on'); addFiles([...e.dataTransfer.files]); };
  }
}

function viewMenu() {
  if (!tracks) return viewImport();
  const n = tracks.length, at = LS.get('tracksAt', 0);
  let cont = '';
  if (T && !T.winner) cont = `<div class="panel row"><div><h2>Незаконченный турнир</h2><div class="mut">${T.n} треков · сыграно ${T.done} из ${T.total}</div></div><span class="spacer"></span><button class="pri" onclick="view='battle';render()">Продолжить →</button></div>`;
  else if (T && T.winner) { const w = tr(T.winner); cont = `<div class="panel row"><div><div class="crown">Прошлый победитель</div><b>${esc(w.n)}</b> <span class="mut">${esc(w.a)}</span></div><span class="spacer"></span><button onclick="view='battle';render()">Результаты</button></div>`; }
  const right = `<button onclick="msg='';view='import';render()">Другой список</button><button class="ghost" onclick="forget()">Сбросить</button>`;
  app.innerHTML = shell(`
    ${msg ? `<div class="err" style="margin:0 0 12px">${esc(msg)}</div>` : ''}
    ${cont}
    <div class="panel">
      <div class="row"><div><div class="stat">${n}</div><div class="mut small">треков загружено${at ? ' · ' + new Date(at).toLocaleString('ru-RU', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : ''}</div></div></div>
      <div class="opts">
        <label class="opt"><input type="radio" name="pool" value="all" checked><b>Все треки</b><span class="mut small">${n} шт.</span></label>
        <label class="opt"><input type="radio" name="pool" value="recent"><b>Последние</b><span class="mut small">недавно лайкнутые</span></label>
        <label class="opt"><input type="radio" name="pool" value="random"><b>Случайные</b><span class="mut small">случайная выборка</span></label>
      </div>
      <div class="row" id="nrow">Сколько треков: <input type="number" id="N" min="2" max="${n}" value="${Math.min(64, n)}"></div>
      <div class="row" style="margin-top:18px"><span class="mut" id="est"></span><span class="spacer"></span><button class="pri" onclick="start()">Начать турнир →</button></div>
    </div>
    <div class="mut small">Управление: <span class="kbd">←</span> левый · <span class="kbd">→</span> правый · <span class="kbd">↓</span> не могу выбрать · <span class="kbd">Z</span> отменить</div>`, right);
  const upd = () => {
    const mode = document.querySelector('input[name=pool]:checked').value;
    document.getElementById('nrow').style.display = mode === 'all' ? 'none' : 'flex';
    const k = mode === 'all' ? n : Math.max(2, Math.min(n, +document.getElementById('N').value || 2));
    document.getElementById('est').textContent = `${k - 1} выборов · примерно ${Math.max(1, Math.round((k - 1) * 6 / 60))} мин`;
  };
  app.querySelectorAll('input').forEach(i => i.addEventListener('input', upd)); upd();
}

function start() {
  const mode = document.querySelector('input[name=pool]:checked').value, n = tracks.length;
  const k = mode === 'all' ? n : Math.max(2, Math.min(n, +document.getElementById('N').value || 2));
  const go = () => {
    let ids = tracks.map(t => t.id);
    if (mode === 'recent') ids = ids.slice(0, k);
    if (mode === 'random') ids = shuffle(ids).slice(0, k);
    T = newTournament(ids); save(); view = 'battle'; render();
  };
  if (T && !T.winner) ask('Начать заново? Незаконченный турнир пропадёт.', go); else go();
}

function card(t, side) {
  let visual, player = '';
  if (FULL && (t.img || t.thumb)) { visual = art(t, 'cover', true).replace('<img', `<img data-side="${side}"`); if (t.sid) player = embed(t.sid, 80); }
  else if (FULL && t.sid) { visual = ''; player = embed(t.sid, 352); }
  else visual = `<div class="cover" style="${grad(t)}" onclick="pick(${side})">${esc(initials(t))}</div>`;
  const listen = FULL && t.sid ? '' : `<a class="listen" href="${esc(spUrl(t))}" target="_blank" rel="noopener">▶ Слушать в Spotify</a>`;
  return `<div class="card">${visual}${player}
    <div class="meta"><div class="tname">${esc(t.n)}</div><div class="tart">${esc(t.a)}</div><div class="tal">${esc(t.al)}</div></div>
    ${listen}<button class="pri pick" onclick="pick(${side})">${side ? 'Этот →' : '← Этот'}</button></div>`;
}

function viewBattle() {
  const a = tr(T.cur[T.i]), b = tr(T.cur[T.i + 1]);
  app.innerHTML = shell(`
    <div class="stage"><b>${stageName()}</b><span class="mut">пара ${T.i / 2 + 1} из ${T.cur.length / 2}</span><span class="spacer"></span><span class="mut small">${T.done} / ${T.total}</span></div>
    <div class="bar" style="margin-top:10px"><div style="width:${T.done / T.total * 100}%"></div></div>
    <div class="vs">${card(a, 0)}<div class="vsmark"><span>VS</span></div>${card(b, 1)}</div>
    <div class="center"><button class="ghost" onclick="pick(-1)">Не могу выбрать — случайно</button></div>`,
    `<button onclick="undo()" ${T.hist.length ? '' : 'disabled'}>↶ Отменить</button><button onclick="view='menu';render()">Меню</button>`);
}

function viewResult() {
  const w = tr(T.winner), r = ranking(), list = showAll ? r : r.slice(0, 32);
  const wArt = FULL && (w.img || w.thumb) ? art(w, 'cover', true) : (FULL && w.sid ? '' : `<div class="cover" style="${grad(w)}">${esc(initials(w))}</div>`);
  const wPlay = FULL && w.sid ? embed(w.sid, wArt ? 152 : 352).replace(/style="height:\d+px"/, `style="height:${wArt ? 152 : 352}px"`) : `<a href="${esc(spUrl(w))}" target="_blank" rel="noopener" style="display:inline-block;margin-top:12px">▶ Открыть в Spotify</a>`;
  app.innerHTML = shell(`
    <div class="panel winner" style="${wArt ? '' : 'grid-template-columns:1fr'}">
      ${wArt}
      <div><div class="crown">🏆 Твой любимый трек</div>
        <div class="tname" style="font-size:28px;margin-top:6px">${esc(w.n)}</div>
        <div class="tart" style="font-size:17px">${esc(w.a)}</div>
        <div class="tal">${w.al ? esc(w.al) + ' · ' : ''}победил среди ${T.n} треков</div>
        ${wPlay}
      </div>
    </div>
    <div class="panel">
      <div class="row" style="margin-bottom:6px"><h2>Итоговая таблица</h2><span class="spacer"></span><button onclick="undo()" ${T.hist.length ? '' : 'disabled'}>↶ Переиграть последний выбор</button></div>
      <div class="mut small" style="margin-bottom:10px">«топ-8» — трек дошёл до четвертьфинала. Внутри одной группы порядок условный.</div>
      <ol class="rank">${list.map((x, i) => { const t = tr(x.id); return `<li><span class="num">${i + 1}</span>${art(t, 'sq')}<div class="t"><div>${esc(t.n)}</div><div class="mut small">${esc(t.a)}</div></div><span class="pill ${i === 0 ? 'g' : ''}">${x.label.replace('🏆 ', '')}</span></li>`; }).join('')}</ol>
      ${r.length > 32 && !showAll ? `<div class="center"><button onclick="showAll=true;render()">Показать все ${r.length}</button></div>` : ''}
    </div>`,
    `<button class="pri" onclick="openShare()">📸 Картинка с результатом</button><button onclick="copyTop(this)">Скопировать топ</button><button onclick="view='menu';render()">Новый турнир</button>`);
}
function copyTop(btn) {
  copy(ranking().slice(0, 32).map((x, i) => { const t = tr(x.id); return `${i + 1}. ${t.a ? t.a + ' — ' : ''}${t.n} (${x.label.replace('🏆 ', '')})`; }).join('\n'), btn);
}

function render() {
  if (view === 'import' || !tracks) viewImport();
  else if (view === 'battle' && T) (T.winner ? viewResult : viewBattle)();
  else viewMenu();
  window.scrollTo(0, 0);
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeShare();
  if (view !== 'battle' || !T || ['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName) || document.querySelector('.modal')) return;
  if (!T.winner && e.key === 'ArrowLeft') { e.preventDefault(); pick(0); }
  else if (!T.winner && e.key === 'ArrowRight') { e.preventDefault(); pick(1); }
  else if (!T.winner && e.key === 'ArrowDown') { e.preventDefault(); pick(-1); }
  else if (['z', 'Z', 'я', 'Я', 'Backspace'].includes(e.key)) { e.preventDefault(); undo(); }
});

render();

</script>
