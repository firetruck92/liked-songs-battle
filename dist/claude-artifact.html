<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Liked Songs Battle</title>
<style>
  :root{
    --bg:#0b0b0c;--panel:#161618;--panel2:#1f1f22;--line:#2a2a2e;
    --fg:#f4f4f5;--mut:#9b9ba3;--acc:#1db954;--acc2:#1ed760;--bad:#ff6b6b;
    --r:16px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--fg)}
  body{font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;
    background:radial-gradient(900px 400px at 50% -120px,#1db95422,transparent 70%),var(--bg);min-height:100vh}
  #app{max-width:960px;margin:0 auto;padding:32px 20px 64px}
  a{color:var(--acc);text-decoration:none} a:hover{text-decoration:underline}
  .mut{color:var(--mut)} .small{font-size:13px}
  .err{color:var(--bad);margin-top:12px}
  html{scrollbar-gutter:stable}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
  .toolbar{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;margin:-4px 0 18px}
  .toolbar:empty{display:none}
  .logo{display:flex;align-items:center;gap:12px;min-width:0;cursor:pointer;color:inherit;text-decoration:none;border-radius:12px;padding:4px 8px 4px 4px;margin:-4px 0 -4px -4px;transition:background .15s}
  .logo:hover{background:#ffffff0a;text-decoration:none}
  .logo:hover .dot{transform:scale(1.08)}
  .logo .dot{transition:transform .15s}
  .logo > div:last-child{min-width:0}
  .logo .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .logo .dot{width:38px;height:38px;border-radius:50%;background:var(--acc);display:grid;place-items:center;color:#000;font-weight:900;font-size:18px}
  .logo h1{font-size:22px;margin:0;letter-spacing:-.01em}
  .logo .sub{font-size:13px;color:var(--mut);margin-top:-2px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:24px;margin-bottom:16px}
  .panel h2{font-size:17px;margin:0 0 4px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .spacer{flex:1}
  button{font:inherit;font-weight:600;border:1px solid var(--line);border-radius:999px;padding:9px 18px;cursor:pointer;background:var(--panel2);color:var(--fg);transition:background .15s,border-color .15s,transform .05s}
  button:hover{border-color:#44444a;background:#26262a}
  button:active{transform:scale(.98)}
  button.pri{background:var(--acc);border-color:var(--acc);color:#000}
  button.pri:hover{background:var(--acc2);border-color:var(--acc2)}
  button.ghost{background:transparent}
  button:disabled{opacity:.4;cursor:default;transform:none}
  input,textarea{font:inherit;background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none}
  input:focus,textarea:focus{border-color:var(--acc)}
  textarea{width:100%;min-height:130px;resize:vertical;display:block}
  input[type=number]{width:96px}
  code{background:var(--panel2);border:1px solid var(--line);padding:2px 7px;border-radius:6px;word-break:break-all;font-size:13px}
  .seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:4px;gap:2px;margin:16px 0 20px;flex-wrap:wrap}
  .seg button{border:0;background:transparent;color:var(--mut);padding:7px 16px}
  .seg button.act{background:var(--fg);color:#000}
  .steps{margin:0 0 18px;padding:0;list-style:none;counter-reset:s}
  .steps li{counter-increment:s;position:relative;padding:4px 0 4px 36px;margin:4px 0}
  .steps li::before{content:counter(s);position:absolute;left:0;top:4px;width:24px;height:24px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--mut)}
  .drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;width:100%;min-height:150px;border:2px dashed #34343a;border-radius:14px;padding:24px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s}
  .drop:hover,.drop.on{border-color:var(--acc);background:#1db9540d}
  .drop .ic{font-size:28px;line-height:1}
  .files{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
  .files li{display:flex;align-items:center;gap:12px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
  .files .fn{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .files .x{margin-left:auto;padding:3px 10px;font-size:13px}
  .flow{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
  .fstep{display:flex;align-items:center;gap:14px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;opacity:.65;transition:opacity .2s,border-color .2s}
  .fstep.cur{opacity:1;border-color:#1db95466}
  .fstep.done{opacity:.8}
  .fstep .fnum{width:28px;height:28px;flex:none;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;background:var(--panel);border:1px solid var(--line);color:var(--mut)}
  .fstep.cur .fnum{background:var(--acc);border-color:var(--acc);color:#000}
  .fstep.done .fnum{background:transparent;border-color:var(--acc);color:var(--acc)}
  .fstep.done .fnum::after{content:''}
  .fstep .ftxt{flex:1;min-width:0}
  .fstep button{flex:none}
  .drop.wait{border-color:#1db95488}
  .drop.ping{animation:ping 1.2s ease 2}
  @keyframes ping{0%,100%{background:transparent}40%{background:#1db95422;border-color:var(--acc)}}
  body.dragging .drop{border-color:var(--acc);background:#1db9541a}
  body.dragging::after{content:attr(data-drop);position:fixed;inset:12px;border:3px dashed var(--acc);border-radius:20px;background:#0b0b0cd0;display:grid;place-items:center;font-size:28px;font-weight:800;color:var(--acc);pointer-events:none;z-index:20}
  @media (max-width:720px){
    .logo h1{font-size:18px;white-space:nowrap}
    .logo .dot{width:32px;height:32px;font-size:15px}
    .logo .sub{font-size:12px}
    header{gap:8px}
    .lang{padding:6px 9px;gap:6px;font-size:12px}
    .seg{display:flex;width:100%}
    .seg button{flex:1;padding:8px 6px;font-size:14px;white-space:nowrap}
    .panel{padding:18px}
    .fstep{padding:12px}
    .toolbar button{flex:1}.fstep{flex-wrap:wrap}.fstep button{width:100%}}
  .langwrap{position:relative;flex:none}
  .lang{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;font-size:13px;letter-spacing:.03em}
  .lang .caret{font-style:normal;color:var(--mut);font-size:11px}
  .langmenu{position:absolute;top:calc(100% + 6px);inset-inline-end:0;z-index:30;min-width:210px;max-height:70vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:0 18px 50px #000b;display:flex;flex-direction:column;gap:2px;animation:menuIn .15s ease}
  @keyframes menuIn{from{opacity:0;transform:translateY(-4px)}}
  .langmenu button{display:flex;align-items:center;gap:10px;border:0;border-radius:10px;background:transparent;padding:9px 10px;font-weight:500;text-align:start}
  .langmenu button:hover{background:var(--panel2)}
  .langmenu button.act{background:#1db9541f;color:var(--acc2)}
  .langmenu .ln{flex:1}
  .langmenu .lc{color:var(--mut);font-size:12px;letter-spacing:.04em}
  .langmenu svg{width:22px;height:15px;border-radius:3px;display:block;box-shadow:0 0 0 1px #0003;flex:none}
  /* справа налево (арабский, иврит): страница зеркалится, но карточки пары остаются «левая/правая», как стрелки */
  [dir=rtl] .vs{direction:ltr}
  [dir=rtl] .vs .card{direction:rtl}
  [dir=rtl] .steps li{padding:4px 36px 4px 0}
  [dir=rtl] .steps li::before{left:auto;right:0}
  [dir=rtl] .logo{margin:-4px -4px -4px 0;padding:4px 4px 4px 8px}
  [dir=rtl] .rank .num{text-align:left}
  .lang svg{width:20px;height:13px;border-radius:3px;display:block;box-shadow:0 0 0 1px #0003}
  .sitelink{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
  .sitelink a{font-weight:600}

  /* анимации турнира */
  .vs .card{position:relative;animation:cardInL .38s cubic-bezier(.2,.8,.2,1) both}
  .vs .card:last-child{animation-name:cardInR}
  @keyframes cardInL{from{opacity:0;transform:translateX(-28px) scale(.96)}}
  @keyframes cardInR{from{opacity:0;transform:translateX(28px) scale(.96)}}
  .vs .card.win,.vs .card.win:last-child{animation-name:cardWin;animation-duration:.56s;animation-timing-function:cubic-bezier(.2,.8,.2,1);animation-fill-mode:forwards}
  .card.win{animation:cardWin .56s cubic-bezier(.2,.8,.2,1) forwards;border-color:var(--acc);box-shadow:0 0 0 2px var(--acc),0 0 48px #1db95455;z-index:2}
  @keyframes cardWin{0%{transform:scale(1)}30%{transform:scale(1.045)}100%{transform:scale(1.025)}}
  .vs .card.lose,.vs .card.lose:last-child{animation-name:cardLose;animation-duration:.5s;animation-timing-function:cubic-bezier(.5,0,.75,0);animation-fill-mode:forwards}
  .card.lose{animation:cardLose .5s cubic-bezier(.5,0,.75,0) forwards;pointer-events:none}
  .card.lose-l{--rot:-4deg}.card.lose-r{--rot:4deg}
  @keyframes cardLose{0%{transform:none;opacity:1}100%{transform:translateY(60px) scale(.9) rotate(var(--rot,0));opacity:0;filter:grayscale(1) blur(1px)}}
  .card .ok{position:absolute;left:50%;top:38%;width:96px;height:96px;margin:-48px 0 0 -48px;border-radius:50%;background:var(--acc);display:grid;place-items:center;box-shadow:0 10px 40px #1db95499;animation:okPop .45s cubic-bezier(.2,1.6,.4,1) both;pointer-events:none}
  .card .ok svg{width:56px;height:56px;fill:none;stroke:#000;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:24;stroke-dashoffset:24;animation:okDraw .3s .12s ease forwards}
  @keyframes okPop{from{transform:scale(0) rotate(-20deg);opacity:0}}
  @keyframes okDraw{to{stroke-dashoffset:0}}
  .vsmark span.hit{animation:vsHit .5s ease}
  @keyframes vsHit{30%{transform:scale(1.35) rotate(12deg);background:var(--acc);color:#000;border-color:var(--acc)}}
  .spark{position:fixed;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;pointer-events:none;z-index:30;animation:spark .65s cubic-bezier(.2,.8,.3,1) forwards}
  @keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
  .confetti{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:40}
  .winner{animation:winIn .6s cubic-bezier(.2,.8,.2,1) both}
  @keyframes winIn{from{opacity:0;transform:translateY(16px) scale(.98)}}
  @media (prefers-reduced-motion: reduce){.vs .card,.card.win,.card.lose,.card .ok,.card .ok svg,.vsmark span.hit,.winner{animation:none!important}.card .ok svg{stroke-dashoffset:0}}
  .socials{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:6px;margin-top:14px}
  .modal img.shareimg{max-height:min(46vh,520px);width:auto;max-width:100%;margin:0 auto}
  .soc{display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 2px;border-radius:12px;font-size:11px;font-weight:600;background:var(--panel2)}
  .soc svg{width:34px;height:34px;padding:7px;border-radius:50%;background:var(--c);color:#fff;box-sizing:border-box}
  .soc[style*="#000"] svg{box-shadow:0 0 0 1px #444}
  .soc:hover{border-color:#44444a;background:#26262a}
  .sheet{position:fixed;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));z-index:15;background:var(--panel);border:1px solid #1db95466;border-radius:18px;padding:14px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;box-shadow:0 12px 40px #000a;animation:sheetIn .3s cubic-bezier(.2,.8,.2,1)}
  .sheet .mut{grid-column:1/-1}
  .sheet .big{width:100%}
  @keyframes sheetIn{from{transform:translateY(120%)}}
  .fakebtn{display:inline-block;border-radius:999px;background:var(--acc);color:#000;font-weight:700;padding:14px 26px}
  .note{background:#1db9540f;border:1px solid #1db95433;border-radius:12px;padding:12px 14px;font-size:13px;color:#cfe9d8}
  details{margin-top:14px} summary{cursor:pointer;color:var(--mut)}
  .opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
  .opt{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:12px 14px;cursor:pointer}
  .opt input{display:none}
  .opt:has(input:checked){border-color:var(--acc);background:#1db95414}
  .opt b{font-size:15px}
  .stat{font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
  .bar{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden}
  .bar>div{height:100%;background:var(--acc);transition:width .25s}
  .stage{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .stage b{font-size:22px;letter-spacing:-.01em}
  .vs{display:grid;grid-template-columns:1fr 56px 1fr;gap:12px;margin-top:20px;align-items:stretch}
  .vsmark{display:grid;place-items:center}
  .vsmark span{width:48px;height:48px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center;font-weight:800;color:var(--mut);font-size:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px;transition:border-color .15s,transform .15s}
  .card:hover{border-color:var(--acc)}
  .cover{width:100%;aspect-ratio:1;border-radius:12px;object-fit:cover;display:grid;place-items:center;cursor:pointer;background:var(--panel2);font-size:64px;font-weight:800;color:#ffffffd9;text-shadow:0 2px 14px #0006;user-select:none}
  .meta{min-height:66px}
  .tname{font-size:18px;font-weight:700;line-height:1.25;overflow-wrap:anywhere}
  .tart{color:var(--mut)} .tal{color:var(--mut);font-size:13px}
  .card iframe{border:0;border-radius:12px;width:100%;display:block;background:var(--panel2)}
  .card .listen{font-size:14px;font-weight:600}
  .card .pick{margin-top:auto;width:100%;padding:12px}
  .center{display:flex;justify-content:center;margin-top:18px}
  .winner{display:grid;grid-template-columns:220px 1fr;gap:24px;align-items:center}
  .winner .cover{cursor:default}
  .winner iframe{border:0;border-radius:12px;width:100%;max-width:460px;height:152px;margin-top:12px}
  .crown{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--acc)}
  .rank{list-style:none;padding:0;margin:0}
  .rank li{display:grid;grid-template-columns:32px 44px 1fr auto;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
  .rank li:last-child{border-bottom:0}
  .rank .num{text-align:right;color:var(--mut);font-variant-numeric:tabular-nums}
  .rank .sq{width:44px;height:44px;border-radius:6px;object-fit:cover;display:grid;place-items:center;font-weight:800;color:#fffd;background:var(--panel2)}
  .rank .t{min-width:0}
  .rank .t div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pill{font-size:12px;color:var(--mut);border:1px solid var(--line);border-radius:999px;padding:2px 10px;white-space:nowrap}
  .pill.g{color:#000;background:var(--acc);border-color:var(--acc);font-weight:700}
  .kbd{display:inline-block;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 6px;font-size:12px;color:var(--fg);background:var(--panel2)}
  .modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:16px;z-index:9}
  .modal .panel{max-width:420px;margin:0}
  .loader{display:flex;flex-direction:column;gap:10px}
  .modal .panel.wide{max-width:520px;width:100%;max-height:calc(100vh - 32px);overflow:auto}
  .shareimg{width:100%;border-radius:12px;display:block;border:1px solid var(--line);background:var(--panel2);aspect-ratio:4/5;object-fit:contain}
  .big{padding:14px 26px;font-size:16px}
  .spot{display:inline-flex;align-items:center;gap:10px}
  .spot svg{width:22px;height:22px}
  @media (max-width:720px){
    #app{padding:20px 14px 48px}
    .vs{grid-template-columns:1fr}.vsmark{height:24px}.vsmark span{width:40px;height:40px}
    .opts{grid-template-columns:1fr}
    .winner{grid-template-columns:1fr}.winner .cover{max-width:240px}
    .cover{font-size:48px}
  }
</style>
</head>
<body>
<div id="app"></div>
<script>
const MODE = 'artifact'; // 'local' — сайт (обложки и отрывки через плеер Spotify); 'artifact' — Claude-артефакт без внешних ресурсов
const FULL = MODE === 'local';
const app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
// Всё хранится только в памяти вкладки: после перезагрузки сайт открывается с чистого листа.
const MEM = new Map();
const LS = {
  get(k, d) { return MEM.has(k) ? JSON.parse(MEM.get(k)) : d; },
  set(k, v) { MEM.set(k, JSON.stringify(v)); return true; },
  del(k) { MEM.delete(k); }
};
// подчищаем то, что сохраняли прошлые версии сайта
try { ['tracks', 'tournament', 'tracksAt', 'dupes', 'lang', 'cid', 'tok', 'state', 'verifier'].forEach(k => localStorage.removeItem(k)); } catch {}
function randStr(n) { const c = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789'; return Array.from(crypto.getRandomValues(new Uint8Array(n)), x => c[x % c.length]).join(''); }
async function challenge(v) { const d = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(v)); return btoa(String.fromCharCode(...new Uint8Array(d))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function hash(s) { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) | 0; return Math.abs(h); }
function grad(t) { const h = hash(t.a + '|' + t.al), h1 = h % 360, h2 = (h1 + 40 + (h >> 9) % 80) % 360; return `background:linear-gradient(135deg,hsl(${h1} 55% 40%),hsl(${h2} 60% 20%))`; }
function initials(t) { return (t.n || '?').replace(/[^\p{L}\p{N}]+/gu, ' ').trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase() || '♪'; }
function sidOf(uri) { const m = String(uri || '').match(/(?:spotify:track:|open\.spotify\.com\/(?:intl-\w+\/)?track\/)([A-Za-z0-9]{22})/); return m ? m[1] : ''; }
function spUrl(t) { return t.sid ? 'https://open.spotify.com/track/' + t.sid : 'https://open.spotify.com/search/' + encodeURIComponent((t.a ? t.a + ' ' : '') + t.n); }
const embed = (sid, h) => `<iframe src="https://open.spotify.com/embed/track/${esc(sid)}?utm_source=generator&theme=0" style="height:${h}px" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>`;

/* ---------- Языки / Languages ---------- */
// plural forms: ru — [1, 2-4, 5+], en — [1, other]
function plu(n, forms) {
  if (LANG === 'en') return n === 1 ? forms[0] : forms[1];
  const a = Math.abs(n) % 100, b = a % 10;
  return a > 10 && a < 20 ? forms[2] : b > 1 && b < 5 ? forms[1] : b === 1 ? forms[0] : forms[2];
}
const I18N = {
  ru: {
    sub: 'Выбери любимый трек из своих лайков',
    yes: 'Да', cancel: 'Отмена',
    copied: 'Скопировано ✓', copyFail: 'Не вышло скопировать', failShort: 'Не вышло',
    tracks: n => `${n} ${plu(n, ['трек', 'трека', 'треков'])}`,
    picks: n => `${n} ${plu(n, ['выбор', 'выбора', 'выборов'])}`,
    // share image
    imgTitle: '🏆 Мой любимый трек',
    imgSub: (n, total) => `победил среди ${I18N.ru.tracks(n)} · ${I18N.ru.picks(total)}`,
    shImgH: 'Поделиться результатом', drawing: 'Рисую…', drawFail: 'Не получилось нарисовать картинку', resultAlt: 'Результат',
    share: 'Поделиться', savePng: 'Сохранить PNG', copyImg: 'Копировать картинку',
    saveHint: 'Сохрани картинку: правый клик или долгое нажатие → «Сохранить изображение».',
    shareTitle: 'Мой любимый трек',

// языки в переключателе: код, родное название
const LANGS = [['ru', 'Русский'], ['en', 'English'], ['uk', 'Українська'], ['de', 'Deutsch'], ['fr', 'Français'], ['es', 'Español'], ['pt', 'Português'], ['zh', '中文'], ['ar', 'العربية'], ['he', 'עברית']];
const RTL = l => l === 'ar' || l === 'he';

// язык по настройкам браузера (первый подходящий из списка), иначе английский
let LANG = (() => {
  const codes = LANGS.map(x => x[0]);
  for (const l of (navigator.languages || [navigator.language || 'en'])) {
    const c = String(l).toLowerCase().slice(0, 2);
    if (codes.includes(c)) return c;
    if (c === 'be' || c === 'kk') return 'ru';
    if (c === 'iw') return 'he';

      p.vy += .55 * devicePixelRatio; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.globalAlpha = Math.max(0, 1 - el / 2600);
      ctx.fillStyle = p.col; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.r * 2))); ctx.restore();
    }
    if (el < 2600) requestAnimationFrame(frame); else c.remove();
  })(t0);
}

/* ---------- Views ---------- */
function viewImport() {
  const tabs = [['files', L('tabFiles')], ['text', L('tabText')]];
  const seg = `<div class="seg">${tabs.map(([k, l]) => `<button class="${srcTab === k ? 'act' : ''}" onclick="srcTab='${k}';msg='';render()">${l}</button>`).join('')}</div>`;
  let body = '';
  if (srcTab === 'files') {
    body = `
      <div class="flow">
        <div class="fstep ${expOpened ? 'done' : 'cur'}">
          <div class="fnum">1</div>
          <div class="ftxt"><b>${L('s1')}</b><div class="mut small">${L(MOBILE ? 's1subM' : 's1sub')}</div></div>
          <button class="${expOpened ? '' : 'pri'}" onclick="openExportify()">${expOpened ? L('openAgain') : L('openExp')}</button>
        </div>
        <div class="fstep ${expOpened && !pending.length ? 'cur' : ''}">
          <div class="fnum">2</div>
          <div class="ftxt"><b>${L('s2')}</b><div class="mut small">${L('s2sub')}</div></div>
        </div>
        <div class="fstep ${expOpened && !pending.length ? 'cur' : ''}">
          <div class="fnum">3</div>
          <div class="ftxt"><b>${L(MOBILE ? 's3m' : 's3')}</b><div class="mut small">${L(MOBILE ? 's3subM' : 's3sub')}</div></div>
        </div>
      </div>
      <label class="drop ${expOpened && !pending.length ? 'wait' : ''}" id="drop">
        <input type="file" accept=".csv,.json,text/csv,application/json" multiple hidden id="fi">
        ${MOBILE ? `<span class="pri big fakebtn">${L('pickBtn')}</span><div class="mut small">${L('dropSubM')}</div>` : `<div class="ic">⤓</div><b>${L('dropT')}</b><div class="mut small">${L('dropSub')}</div>`}
      </label>
      ${pending.length ? `<ul class="files">${pending.map((p, i) => `<li><span>📄</span><span class="fn">${esc(p.name)}</span><span class="mut small">${L('fileTracks', p.list.length)}</span><button class="x ghost" onclick="removeFile(${i})">✕</button></li>`).join('')}</ul>
        <div class="row" style="margin-top:16px"><span class="mut">${L('totalUniq')} <b style="color:var(--fg)">${pendingCount()}</b></span><span class="spacer"></span><button class="pri" onclick="usePending()">${L('done')}</button></div>` : ''}
      ${msg ? `<div class="err">${esc(msg)}</div>` : ''}`;
  } else {
    body = `
      <div class="mut" style="margin-bottom:10px">${L('textHint', FULL)}</div>
      <textarea id="paste" placeholder="${L('pastePh')}"></textarea>
      <div class="row" style="margin-top:14px"><span class="spacer"></span><button class="pri" onclick="importPasted()">${L('loadList')}</button></div>
      ${msg ? `<div class="err">${esc(msg)}</div>` : ''}`;
  }
  const limit = FULL ? '' : `<div class="note" style="margin-top:20px">${L('limitNote')}</div>`;
  app.innerHTML = shell(`
    <div class="panel"><h2>${L('importH')}</h2><div class="mut small">${L('importSub')}</div>
      ${seg}${body}${limit}
    </div>
    <div class="mut small">${L('privacy')} · <a href="#" onclick="demo();return false">${L('demo')}</a></div>`,
    tracks ? `<button onclick="view='menu';msg='';render()">${L('back')}</button>` : '');
  const fi = document.getElementById('fi'), dr = document.getElementById('drop');
  if (fi) {
    fi.onchange = () => { addFiles([...fi.files]); fi.value = ''; };
    dr.ondragover = e => { e.preventDefault(); dr.classList.add('on'); };
    dr.ondragleave = () => dr.classList.remove('on');
    dr.ondrop = e => { e.preventDefault(); e.stopPropagation(); dr.classList.remove('on'); document.body.classList.remove('dragging'); addFiles([...e.dataTransfer.files]); };
  }
}

function viewMenu() {
  if (!tracks) return viewImport();
  const n = tracks.length, at = LS.get('tracksAt', 0), dupes = LS.get('dupes', 0);
  let cont = '';
  if (T && !T.winner) cont = `<div class="panel row"><div><h2>${L('unfinished')}</h2><div class="mut">${L('unfinishedSub', T.n, T.done, T.total)}</div></div><span class="spacer"></span><button class="pri" onclick="view='battle';render()">${L('cont')}</button></div>`;
  else if (T && T.winner) { const w = tr(T.winner); cont = `<div class="panel row"><div><div class="crown">${L('prevWinner')}</div><b>${esc(w.n)}</b> <span class="mut">${esc(w.a)}</span></div><span class="spacer"></span><button onclick="view='battle';render()">${L('results')}</button></div>`; }
  const right = `<button onclick="forget()">${L('reset')}</button>`;
  app.innerHTML = shell(`
    ${msg ? `<div class="err" style="margin:0 0 12px">${esc(msg)}</div>` : ''}
    ${cont}
    <div class="panel">
      <div class="row"><div><div class="stat">${n}</div><div class="mut small">${L('loaded', n)}${dupes ? L('dupes', dupes) : ''}${at ? ' · ' + new Date(at).toLocaleString(LANG === 'en' ? 'en-GB' : LANG, { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : ''}</div></div></div>
      <div class="opts">
        <label class="opt"><input type="radio" name="pool" value="all" checked><b>${L('optAll')}</b><span class="mut small">${L('pcs', n)}</span></label>
        <label class="opt"><input type="radio" name="pool" value="recent"><b>${L('optRecent')}</b><span class="mut small">${L('optRecentSub')}</span></label>
        <label class="opt"><input type="radio" name="pool" value="random"><b>${L('optRandom')}</b><span class="mut small">${L('optRandomSub')}</span></label>
      </div>
      <div class="row" id="nrow">${L('howMany')} <input type="number" id="N" min="2" max="${n}" value="${Math.min(64, n)}"></div>
      <div class="row" style="margin-top:18px"><span class="mut" id="est"></span><span class="spacer"></span><button class="pri" onclick="start()">${L('start')}</button></div>
    </div>
    <div class="mut small" style="${MOBILE ? 'display:none' : ''}">${L('controls')} <span class="kbd">←</span> ${L('cLeft')} · <span class="kbd">→</span> ${L('cRight')} · <span class="kbd">↓</span> ${L('cRand')} · <span class="kbd">Z</span> ${L('cUndo')}</div>`, right);
  const upd = () => {
    const mode = document.querySelector('input[name=pool]:checked').value;
    document.getElementById('nrow').style.display = mode === 'all' ? 'none' : 'flex';
    const k = mode === 'all' ? n : Math.max(2, Math.min(n, +document.getElementById('N').value || 2));
    document.getElementById('est').textContent = L('est', k, Math.max(1, Math.round((k - 1) * 6 / 60)));
  };
  app.querySelectorAll('input').forEach(i => i.addEventListener('input', upd)); upd();
}

function start() {
  const mode = document.querySelector('input[name=pool]:checked').value, n = tracks.length;
  const k = mode === 'all' ? n : Math.max(2, Math.min(n, +document.getElementById('N').value || 2));
  const go = () => {
    let ids = tracks.map(t => t.id);
    if (mode === 'recent') ids = ids.slice(0, k);
    if (mode === 'random') ids = shuffle(ids).slice(0, k);
    T = newTournament(ids); save(); view = 'battle'; render();
  };
  if (T && !T.winner) ask(L('restartQ'), go); else go();
}

function card(t, side) {
  let visual, player = '';
  if (FULL && (t.img || t.thumb)) { visual = art(t, 'cover', true).replace('<img', `<img data-side="${side}"`); if (t.sid) player = embed(t.sid, 80); }
  else if (FULL && t.sid) { visual = ''; player = embed(t.sid, 352); }
  else visual = `<div class="cover" style="${grad(t)}" onclick="choose(${side})">${esc(initials(t))}</div>`;
  const listen = FULL && t.sid ? '' : `<a class="listen" href="${esc(spUrl(t))}" target="_blank" rel="noopener">${L('listen')}</a>`;
  return `<div class="card">${visual}${player}
    <div class="meta"><div class="tname">${esc(t.n)}</div><div class="tart">${esc(t.a)}</div><div class="tal">${esc(t.al)}</div></div>
    ${listen}<button class="pri pick" onclick="choose(${side})">${side ? L('thisR') : L('thisL')}</button></div>`;
}

function viewBattle() {
  const a = tr(T.cur[T.i]), b = tr(T.cur[T.i + 1]);
  app.innerHTML = shell(`
    <div class="stage"><b>${stageName()}</b><span class="mut">${L('pair', T.i / 2 + 1, T.cur.length / 2)}</span><span class="spacer"></span><span class="mut small">${T.done} / ${T.total}</span></div>
    ${saveFailed ? `<div class="err" style="margin:8px 0">${L('saveWarn')}</div>` : ''}<div class="bar" style="margin-top:10px"><div style="width:${T.done / T.total * 100}%"></div></div>
    <div class="vs">${card(a, 0)}<div class="vsmark"><span>VS</span></div>${card(b, 1)}</div>
    <div class="center"><button class="ghost" onclick="choose(-1)">${L('cantChoose')}</button></div>`,
    `<button onclick="undo()" ${T.hist.length ? '' : 'disabled'}>${L('undo')}</button><button onclick="view='menu';render()">${L('menu')}</button>`);
}

function winnerPanel(w, crown, sub) {
  const wArt = FULL && (w.img || w.thumb) ? art(w, 'cover', true) : (FULL && w.sid ? '' : `<div class="cover" style="${grad(w)}">${esc(initials(w))}</div>`);
  const wPlay = FULL && w.sid ? embed(w.sid, wArt ? 152 : 352) : `<a href="${esc(spUrl(w))}" target="_blank" rel="noopener" style="display:inline-block;margin-top:12px">${L('openSp')}</a>`;
  return `<div class="panel winner" style="${wArt ? '' : 'grid-template-columns:1fr'}">
      ${wArt}
      <div><div class="crown">${crown}</div>
        <div class="tname" style="font-size:28px;margin-top:6px">${esc(w.n)}</div>
        <div class="tart" style="font-size:17px">${esc(w.a)}</div>
        <div class="tal">${w.al ? esc(w.al) + ' · ' : ''}${sub}</div>
        ${wPlay}
      </div>
    </div>`;
}
function rankList(list) {
  return `<ol class="rank">${list.map((x, i) => `<li><span class="num">${i + 1}</span>${art(x.t, 'sq')}<div class="t"><div>${esc(x.t.n)}</div><div class="mut small">${esc(x.t.a)}</div></div><span class="pill ${i === 0 ? 'g' : ''}">${x.label.replace('🏆 ', '')}</span></li>`).join('')}</ol>`;
}

function viewResult() {
  const w = tr(T.winner), r = ranking(), list = showAll ? r : r.slice(0, 32);
  app.innerHTML = shell(`
    ${winnerPanel(w, L('yourFav'), L('wonAmong', T.n))}
    <div class="panel">
      <div class="row" style="margin-bottom:6px"><h2>${L('table')}</h2><span class="spacer"></span><button onclick="undo()" ${T.hist.length ? '' : 'disabled'}>${L('replayLast')}</button></div>
      <div class="mut small" style="margin-bottom:10px">${L('tableHint')}</div>
      ${rankList(list.map(x => ({ t: tr(x.id), label: x.label })))}
      ${r.length > 32 && !showAll ? `<div class="center"><button onclick="showAll=true;render()">${L('showAll', r.length)}</button></div>` : ''}
    </div>`,
    `<button class="pri" onclick="shareResult()">${L('shareBtn')}</button><button onclick="copyTop(this)">${L('copyTop')}</button><button onclick="view='menu';render()">${L('newT')}</button>`);
  if (FULL || DL) setTimeout(prepareShare, 50);
  if (celebrate) { celebrate = false; setTimeout(confetti, 60); }
}
function copyTop(btn) {
  copy(ranking().slice(0, 32).map((x, i) => { const t = tr(x.id); return `${i + 1}. ${t.a ? t.a + ' — ' : ''}${t.n} (${x.label.replace('🏆 ', '')})`; }).join('\n'), btn);
}

/* ---------- Ссылка на результат / Result link ---------- */
// Топ-10 упаковывается прямо в адрес (#r=…), сервер не нужен.
function b64urlEncode(s) { const b = new TextEncoder().encode(s); let bin = ''; b.forEach(x => bin += String.fromCharCode(x)); return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
function b64urlDecode(s) { const bin = atob(s.replace(/-/g, '+').replace(/_/g, '/')); return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))); }
function resultCode() {
  const r = ranking().slice(0, 10);
  return b64urlEncode(JSON.stringify({ v: 1, n: T.n, t: r.map(x => { const t = tr(x.id); return [t.n, t.a, t.sid || '', (t.img || '').replace('https://i.scdn.co/image/', ''), x.code]; }) }));
}
function resultUrl() { return location.origin + location.pathname + '#r=' + resultCode(); }
async function shareLink(btn) {
  const w = tr(T.winner), url = resultUrl();
  const text = L('shareText', (w.a ? w.a + ' — ' : '') + w.n) + '. ' + L('shareInvite');
  if (FULL && navigator.share && /Android|iPhone|iPad|Mobile/i.test(navigator.userAgent)) {
    try { await navigator.share({ title: L('shareTitle'), text, url }); return; } catch (e) { if (e.name === 'AbortError') return; }
  }
  copy(text + ' ' + url, btn);
  setTimeout(() => { if (btn.textContent === L('copied')) btn.textContent = L('linkCopied'); }, 0);
}
let shared = null;
function readShared() {
  const m = location.hash.match(/^#r=([A-Za-z0-9_-]+)/);
  if (!m) return null;
  try {
    const d = JSON.parse(b64urlDecode(m[1]));
    if (!d || !Array.isArray(d.t) || !d.t.length) throw 0;
    return { n: +d.n || d.t.length, list: d.t.map(x => ({ t: { n: String(x[0] || ''), a: String(x[1] || ''), al: '', sid: /^[A-Za-z0-9]{22}$/.test(x[2]) ? x[2] : '', img: /^[A-Za-z0-9]{20,60}$/.test(x[3] || '') ? 'https://i.scdn.co/image/' + x[3] : '', thumb: '' }, code: String(x[4] || '') })) };
  } catch { return { bad: true }; }
}
function sharedLabel(c) { return c === 'w' ? L('lWinner') : c === 'q' ? L('lQual') : c === '2' ? L('l2') : L('lTop', c); }
function viewShared() {
  const leave = `<button class="pri" onclick="leaveShared()">${L('playYours')}</button>`;
  if (shared.bad) { app.innerHTML = shell(`<div class="panel"><div class="err" style="margin:0 0 14px">${L('badLink')}</div>${leave}</div>`); return; }
  const w = shared.list[0].t;
  app.innerHTML = shell(`
    ${winnerPanel(w, L('friendFav'), L('friendWon', shared.n))}
    ${shared.list.length > 1 ? `<div class="panel"><h2 style="margin-bottom:10px">${L('friendTop')}</h2>${rankList(shared.list.map(x => ({ t: x.t, label: sharedLabel(x.code) })))}</div>` : ''}
    <div class="center">${leave}</div>`, leave);
}
function leaveShared() { shared = null; history.replaceState(null, '', location.pathname); render(); }

function render() {
  if (view !== 'import' && tracks) hidePickSheet();
  if (shared) viewShared();
  else if (view === 'import' || !tracks) viewImport();
  else if (view === 'battle' && T) (T.winner ? viewResult : viewBattle)();
  else viewMenu();
  window.scrollTo(0, 0);
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeShare();
  if (view !== 'battle' || !T || shared || ['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName) || document.querySelector('.modal')) return;
  if (!T.winner && e.key === 'ArrowLeft') { e.preventDefault(); choose(0); }
  else if (!T.winner && e.key === 'ArrowRight') { e.preventDefault(); choose(1); }
  else if (!T.winner && e.key === 'ArrowDown') { e.preventDefault(); choose(-1); }
  else if (['z', 'Z', 'я', 'Я', 'Backspace'].includes(e.key)) { e.preventDefault(); if (!animating) undo(); }
});
window.addEventListener('hashchange', () => { shared = readShared(); render(); });

if (FULL) shared = readShared();
applyLang();
render();

</script>
</body>
